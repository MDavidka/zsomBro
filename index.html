<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ZsomBro</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    
    <!-- Mobile Touch Controls (only shown on touch/mobile) -->
    <div id="mobile-controls">
      <div class="mobile-dpad">
        <button id="btn-left" class="touch-btn">◀</button>
        <button id="btn-right" class="touch-btn">▶</button>
      </div>
      <div class="mobile-actions">
        <button id="btn-run" class="touch-btn action-btn">RUN</button>
        <button id="btn-jump" class="touch-btn action-btn primary-btn">JUMP</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/game.js"></script>
</body>
</html>
